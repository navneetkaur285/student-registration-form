<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>
            <i>
                <u>STUDENT REGISTRATION FORM</u>
            </i>
        </h1>

        <form>

            <fieldset>
                <legend>
                    <b>
                        <big>Student Details</big>
                    </b>
                </legend>

            <label for="name">Student Name : </label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <br><br>

            <label for="father">Father's Name : </label>
            <input type="text" id="father" placeholder="Enter father's name" required>
            <br><br>

            <label for="mother">Mother's Name : </label>
            <input type="text" id="mother" placeholder="Enter mother's name" required>
            <br><br>

            <label for="email">Email : </label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <br><br>

            <label for="phone">Contact Number : </label>
            <input type="tel" id="phone" placeholder="Enter your contact number" maxlength="10" required>
            <br><br>

            <label for="dob">Date of Birth : </label>
            <input type="date" id="dob" required>
            <br><br>

            <label>Gender : </label>

            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>
            <br><br>

            <label for="course">Course : </label>
            <select id="course" required>
                <option value="">--Select Course</option>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>BA</option>
            </select>
            <br><br>

            <label for="branch">Branch : </label>
            <select id="branch" required>
                <option value="">--Select Branch--</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>
            <br><br>

            <label for="semester">Semester : </label>
            <select id="semester" required>
                <option value="">--Select Semester--</option>
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
            </select>
            <br><br>

            <label for="address">Address : </label><br>
            <textarea id="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
            <br><br>

            <label>Hobbies : </label>

            <input type="checkbox" id="reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="sports">
            <label for="sports">Sports</label>

            <input type="checkbox" id="music">
            <label for="music">Music</label>

            <input type="checkbox" id="coding">
            <label for="coding">Coding</label>
            <br><br>

            <label for="photo">Upload Photo : </label>
            <input type="file" id="photo">
            <br><br>

            <button type="submit">Register</button>
            <button type="reset">Reset</button>

            </fieldset>

              
        </form>
    </div>
    
</body>
</html>
